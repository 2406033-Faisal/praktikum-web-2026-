<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List - Modul 5</title>
    <link rel="stylesheet" href="style.css">    
</head>
<body>
    <div class="todo-app">
        <h2>Daftar Tugas Saya</h2>
        <!-- From infut tugas-->
        <form id="todoForm" novalidate>
            <div class=" input-section">
                <input type="text" id="taskInput" placeholder="Ketikkan tugas baru anda..." >
                <button type="submit" class="add-btn">Tambah</button>
            </div>
            <div class="eror-massage" id="inputError">Tugas tidak boleh kosong atau kurang dari 3 karakter</div>
        </form>
        <!-- Daftar Tugas-->
         <ul Class="todo-list" id="todoList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
